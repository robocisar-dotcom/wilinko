<!DOCTYPE html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <title>WILLIE</title>
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body style="margin:0;background:#050505;color:#fff;font-family:system-ui, -apple-system, Segoe UI, Arial, sans-serif;">
    <div id="gate" style="position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:22px;">
      <div style="width:100%;max-width:520px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);border-radius:28px;padding:18px 18px 16px;backdrop-filter:blur(14px);">
        <div style="font-weight:900;letter-spacing:.08em;text-transform:uppercase;font-size:12px;opacity:.7;">Brána</div>
        <div style="font-weight:950;letter-spacing:-.02em;font-size:28px;margin-top:6px;">WILLIE</div>
        <div style="opacity:.55;font-size:13px;line-height:1.45;margin-top:6px;">
          Vyber režim zariadenia. Telefón slúži na rýchle úpravy; Tablet/PC je hlavné zobrazenie.
        </div>
        <div style="display:grid;grid-template-columns:1fr;gap:12px;margin-top:16px;">
          <button id="gate-phone" type="button" style="min-height:52px;border-radius:22px;border:1px solid rgba(116,184,22,.35);background:rgba(116,184,22,.16);color:#d9f99d;font-weight:900;letter-spacing:.08em;text-transform:uppercase;font-size:11px;cursor:pointer;">
            Telefón (ovládač)
          </button>
          <button id="gate-desktop" type="button" style="min-height:52px;border-radius:22px;border:1px solid rgba(51,154,240,.35);background:rgba(51,154,240,.14);color:#bae6fd;font-weight:900;letter-spacing:.08em;text-transform:uppercase;font-size:11px;cursor:pointer;">
            Tablet / PC (hlavný displej)
          </button>
        </div>
        <div style="opacity:.45;font-size:11px;line-height:1.45;margin-top:14px;">
          Poznámka: ak má telefón zapisovať zmeny na tablet/PC cez internet, zapni Cloud sync (Firebase) v aplikácii.
        </div>
      </div>
    </div>

    <iframe
      id="appFrame"
      title="WILLIE"
      src="about:blank"
      style="position:fixed;inset:0;border:0;width:100%;height:100%;display:none;"
      allow="fullscreen"
    ></iframe>

    <script>
      (function () {
        var LS = "willi_entry_device";
        var gate = document.getElementById("gate");
        var frame = document.getElementById("appFrame");

        function openApp(mode) {
          try { localStorage.setItem(LS, mode); } catch (e) {}
          // app.html už má vlastný device systém (param ?device=phone/tablet/pc)
          var dev = mode === "phone" ? "phone" : "tablet";
          frame.src = "./app.html?device=" + encodeURIComponent(dev);
          frame.style.display = "block";
          gate.style.display = "none";
        }

        function showGate() {
          frame.style.display = "none";
          gate.style.display = "flex";
        }

        var stored = null;
        try { stored = localStorage.getItem(LS); } catch (e) {}
        stored = (stored === "phone" || stored === "desktop") ? stored : null;

        document.getElementById("gate-phone").addEventListener("click", function () { openApp("phone"); });
        document.getElementById("gate-desktop").addEventListener("click", function () { openApp("desktop"); });

        if (stored) openApp(stored);
        else showGate();
      })();
    </script>

    <a
      href="https://github.com/robocisar-dotcom/wilinko"
      target="_blank"
      rel="noopener noreferrer"
      style="position:fixed;left:10px;bottom:10px;z-index:5;font-size:11px;opacity:.45;text-decoration:none;color:#fff;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);padding:6px 10px;border-radius:999px;backdrop-filter:blur(10px);"
      aria-label="GitHub repozitár: robocisar-dotcom/wilinko"
      >robocisar-dotcom/wilinko</a
    >
    <noscript>Zapni JavaScript.</noscript>
  </body>
</html>
